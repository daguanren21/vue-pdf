name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # Required for npm Trusted Publishing (OIDC). Do NOT use NPM_TOKEN.
  id-token: write

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Changesets needs full history for changelogs
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs a recent npm CLI for OIDC exchange.
      - name: Ensure modern npm for OIDC
        run: npm install -g npm@11.5.1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          # Auth is OIDC only — no NPM_TOKEN / NODE_AUTH_TOKEN.
          # Trusted Publisher for @daguanren21/vue-pdf and @daguanren21/vue-resize-sensor
          # must point at this workflow filename: release.yml
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
